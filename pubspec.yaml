name: data_hmamat
description: "Data Hmamat - offline pigeon records, bilateral pedigree, weekly photos."
publish_to: none
version: 0.6.1+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  file_picker: ^13.4.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  fl_chart: ^1.3.1
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8338EC"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
