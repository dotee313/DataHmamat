name: data_hmamat
description: "سجل حماماتك المحلي - بيانات، نسب عائلي، وصور أسبوعية قابلة للتكبير."
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  file_picker: ^13.4.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8338EC"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
